<form class="contact-form" action="https://formspree.io/f/mgepkabk" method="post">
  <div class="form-field">
    <label for="name">Name <span aria-hidden="true">*</span></label>
    <input id="name" name="name" type="text" autocomplete="name" required aria-required="true">
  </div>
  <div class="form-field">
    <label for="email">Email <span aria-hidden="true">*</span></label>
    <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-required="true">
  </div>
  <div class="form-field">
    <label for="phone">Phone <span class="field-note">(optional)</span></label>
    <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel">
  </div>
  <div class="form-field">
    <label for="message">How can we help? <span aria-hidden="true">*</span></label>
    <textarea id="message" name="message" rows="6" required aria-required="true"></textarea>
  </div>
  <p class="form-note">Fields marked * are required. We use the information you provide only to respond to your request.</p>
  <button class="button button--primary" type="submit">Send message</button>
</form>
