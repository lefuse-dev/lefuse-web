title: Lefuse
description: Lefuse is an independent product company that builds software to simplify the workflows between intent and outcome.
url: "https://www.lefuse.com"
baseurl: ""
lang: en
theme: null

logo: /assets/images/logo.svg
social_image: /assets/images/social-card.jpg

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/social-card.jpg

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
